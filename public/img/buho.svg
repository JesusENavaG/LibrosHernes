<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240" role="img" aria-label="Buhito Sabio, el búho mago de LibrosHernes">
  <defs>
    <linearGradient id="cuerpoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7850"/>
      <stop offset="1" stop-color="#7d6142"/>
    </linearGradient>
    <linearGradient id="gorroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <g id="estrella">
      <path d="M0,-7 L1.76,-2.43 L6.66,-2.16 L2.85,0.93 L4.12,5.66 L0,3 L-4.12,5.66 L-2.85,0.93 L-6.66,-2.16 L-1.76,-2.43 Z" fill="#fde68a"/>
    </g>
  </defs>

  <!-- Patas -->
  <g stroke="#d97706" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M93 204 L74 216"/>
    <path d="M93 204 L85 219"/>
    <path d="M93 204 L97 219"/>
    <path d="M127 204 L146 216"/>
    <path d="M127 204 L135 219"/>
    <path d="M127 204 L123 219"/>
  </g>

  <!-- Cuerpo -->
  <ellipse cx="110" cy="145" rx="62" ry="63" fill="url(#cuerpoGrad)"/>

  <!-- Alas -->
  <path d="M62 112 C 44 138, 46 176, 68 194 C 78 180, 76 148, 72 114 Z" fill="#6f5636"/>
  <path d="M158 112 C 176 138, 174 176, 152 194 C 142 180, 144 148, 148 114 Z" fill="#6f5636"/>
  <g stroke="#5d472c" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
