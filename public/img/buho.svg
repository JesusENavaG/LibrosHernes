  <path d="M108 12 C 118 10, 126 16, 127 24 C 130 46, 138 66, 152 92 L 66 92 C 78 60, 90 32, 108 12 Z" fill="url(#gorroGrad)"/>
  <path d="M108 12 C 118 10, 126 16, 127 24 C 122 30, 114 34, 104 36 C 102 26, 103 17, 108 12 Z" fill="#7c3aed" opacity="0.55"/>
  <use href="#estrella" transform="translate(118 44) scale(1)"/>
  <use href="#estrella" transform="translate(96 68) scale(0.7)"/>
  <use href="#estrella" transform="translate(131 72) scale(0.55)"/>
  <circle cx="112" cy="24" r="6.5" fill="#fde68a"/>
  <circle cx="115.5" cy="22" r="5.4" fill="#5b21b6"/>

  <!-- Ala del sombrero -->
  <ellipse cx="110" cy="92" rx="64" ry="14" fill="#4c1d95"/>
  <ellipse cx="110" cy="89" rx="64" ry="12" fill="#5b21b6"/>
  <path d="M48 89 q62 10 124 0" stroke="#7c3aed" stroke-width="2.5" fill="none" opacity="0.7"/>
  <rect x="52" y="84" width="116" height="7" rx="3.5" fill="#fde68a" opacity="0.9"/>

  <!-- Destellos mágicos -->
  <g fill="#fbbf24">
    <use href="#estrella" transform="translate(30 60) scale(0.6)"/>
    <use href="#estrella" transform="translate(192 74) scale(0.5)"/>
    <circle cx="24" cy="106" r="2.6"/>
    <circle cx="198" cy="118" r="2.2"/>
    <circle cx="176" cy="34" r="2"/>
  </g>
