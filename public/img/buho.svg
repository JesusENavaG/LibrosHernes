  <g stroke="#dcc9a5" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M96 140 q6 7 12 0"/>
    <path d="M114 140 q6 7 12 0"/>
    <path d="M89 156 q6 7 12 0"/>
    <path d="M107 156 q6 7 12 0"/>
    <path d="M125 156 q6 7 12 0"/>
    <path d="M96 172 q6 7 12 0"/>
    <path d="M114 172 q6 7 12 0"/>
  </g>

  <!-- Penachos asomando bajo el sombrero -->
  <path d="M60 104 L52 82 L72 94 Z" fill="#6f5636"/>
  <path d="M160 104 L168 82 L148 94 Z" fill="#6f5636"/>

  <!-- Cara -->
  <circle cx="86" cy="126" r="23" fill="#fffdf7" stroke="#e3d5bb" stroke-width="2"/>
  <circle cx="134" cy="126" r="23" fill="#fffdf7" stroke="#e3d5bb" stroke-width="2"/>
  <circle cx="89" cy="129" r="11" fill="#2b2119"/>
  <circle cx="137" cy="129" r="11" fill="#2b2119"/>
  <circle cx="93" cy="125" r="3.6" fill="#ffffff"/>
  <circle cx="141" cy="125" r="3.6" fill="#ffffff"/>
  <circle cx="85.5" cy="133" r="1.6" fill="#ffffff" opacity="0.85"/>
  <circle cx="133.5" cy="133" r="1.6" fill="#ffffff" opacity="0.85"/>

  <!-- Cejas sabias -->
  <path d="M70 106 q16 -7 30 -2" stroke="#6f5636" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M150 106 q-16 -7 -30 -2" stroke="#6f5636" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Pico -->
  <path d="M110 136 L100 150 Q110 158 120 150 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>

