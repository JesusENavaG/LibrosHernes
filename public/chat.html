<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buhito Sabio 🦉 | Chat de LibrosHernes</title>
  <meta name="description" content="Consultá al Buhito Sabio: precios, stock, disponibilidad y recomendaciones de libros de LibrosHernes." />
  <link rel="icon" type="image/svg+xml" href="img/buho.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body>

  <header class="chat__header">
    <a href="/" class="chat__volver" aria-label="Volver a la tienda">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      <span>Tienda</span>
    </a>

    <div class="chat__identidad">
      <img src="img/buho.svg" alt="Buhito Sabio" class="chat__avatar" />
      <div>
        <h1>Buhito Sabio <span aria-hidden="true">🦉</span></h1>
        <p class="chat__estado"><span class="chat__punto"></span> Guardián de LibrosHernes · siempre despierto</p>
      </div>
    </div>

    <a href="#" id="btnWhatsapp" class="chat__whatsapp" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35zM12 2a10 10 0 0 0-8.6 15.06L2 22l5.06-1.33A10 10 0 1 0 12 2zm0 18.2a8.16 8.16 0 0 1-4.16-1.14l-.3-.18-3 .79.8-2.93-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
    </a>
  </header>

  <!-- Ficha del libro desde el que se abrió el chat -->
  <div class="chat__contexto" id="contextoLibro" hidden>
    <img id="contextoImg" src="img/covers/sin-imagen.svg" alt="" />
    <div>
      <span class="chat__contexto-etiqueta">Consultando sobre</span>
      <strong id="contextoTitulo"></strong>
      <span id="contextoPrecio"></span>
    </div>
  </div>

  <main class="chat__cuerpo" id="mensajes" aria-live="polite"></main>

  <div class="chat__sugerencias" id="sugerencias"></div>

  <form class="chat__formulario" id="formChat">
    <textarea id="inputMensaje" rows="1" maxlength="1000"
      placeholder="Preguntale al búho: precios, stock, recomendaciones..."
      aria-label="Escribí tu mensaje"></textarea>
    <button type="submit" id="btnEnviar" aria-label="Enviar mensaje">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
    </button>
  </form>

  <p class="chat__nota">
    El Buhito usa inteligencia artificial: puede equivocarse. Los precios y stock confirmados son los del
    <a href="/">catálogo de la tienda</a>.
  </p>

  <script src="js/chat.js"></script>
</body>
</html>
